# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=true

# LatinIME depends on androidx (legacy-support-v4, viewpager, annotation).
android.useAndroidX=true
android.enableJetifier=false

# LatinIME resources are all in one module; keep the classic R class behaviour
# so resources are referenced the way the AOSP sources expect.
android.nonTransitiveRClass=false
android.nonFinalResIds=false
