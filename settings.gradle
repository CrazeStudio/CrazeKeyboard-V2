// Standalone Gradle settings for AOSP LatinIME.
//
// Upstream's build.gradle declared jcenter() (shutdown) and AOSP-tree-only
// maven repos (../../../prebuilts/fullsdk-*/...). Both are replaced here with
// repositories that resolve on any machine.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'LatinIME'
