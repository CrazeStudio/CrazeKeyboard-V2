// AOSP LatinIME — standalone Gradle build.
//
// This is the upstream AOSP build.gradle, modernised so it builds outside a
// full AOSP checkout:
//   * AGP 3.2.0-beta03 / Gradle 4.6  -> AGP 8.6.1 / Gradle 8.7 (JDK 17)
//   * compileSdk 28 -> 35: upstream main (Android.bp sdk_version: "current")
//     references Build.VERSION_CODES.VANILLA_ICE_CREAM (API 35).
//   * jcenter() and AOSP-only prebuilt maven repos -> settings.gradle
//   * `package` moved from AndroidManifest.xml into `namespace` (AGP 8)
//   * `aaptOptions` -> `androidResources`
//   * `externalNativeBuild` points at native/jni/Android.mk (the ndk-build
//     equivalent of AOSP's native/jni/Android.bp, generated from it)
//   * debug signing uses the standard debug keystore; java/shared.keystore is
//     AOSP's platform "shared" certificate and only applies to system builds.
//
// Everything else (package id, min/target SDK, source sets, dict handling,
// the native STL/flags) matches Android.bp.

plugins {
    id 'com.android.application' version '8.6.1'
}

android {
    // namespace = the Java/R package (unchanged from AOSP so the 321 source
    // files keep resolving R/BuildConfig). applicationId below is the package
    // name the device reports; it does not have to match namespace.
    namespace 'com.android.inputmethod.latin'
    compileSdk 35
    buildToolsVersion '34.0.0'
    ndkVersion '26.1.10909125'

    // Required if using classes in android.test.runner / .base / .mock
    // (used by the instrumentation tests under tests/).
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'

    defaultConfig {
        applicationId 'com.crazestudio.cboard'
        minSdk 21
        targetSdk 30

        // Matches android:versionCode="30" in java/AndroidManifest.xml.
        versionCode 30
        versionName '1.0'

        testApplicationId 'com.crazestudio.cboard.tests'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            ndkBuild {
                // Android.bp: target.android.stl = "libc++_static".
                // ndk-build selects the STL from APP_STL only (LOCAL_STL is
                // not honoured by this NDK), and APP_STL otherwise defaults to
                // "system", which provides nothing but new/delete.
                arguments 'APP_STL=c++_static'
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'java/proguard.flags'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            manifest.srcFile 'java/AndroidManifest.xml'
            java.srcDirs = ['common/src', 'java/src']
            res.srcDirs = ['java/res']
        }

        androidTest {
            manifest.srcFile 'tests/AndroidManifest.xml'
            java.srcDirs = ['tests/src']
            res.srcDirs = ['tests/res']
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'native/jni/Android.mk'
        }
    }

    androidResources {
        // Do not compress dictionary files; they are mmap()ed at runtime.
        // Equivalent to AOSP's aaptflags: ["-0 .dict"].
        noCompress 'dict'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
        baseline file('java/lint-baseline.xml')
    }
}

dependencies {
    // Android.bp static_libs: androidx.legacy_legacy-support-v4, jsr305
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'

    // legacy-support-v4:1.0.0 pins androidx.core to 1.0.0, but AOSP builds
    // against a modern prebuilt androidx.core. The sources use
    // AccessibilityNodeInfoCompat.setTextEntryKey(), which only exists from
    // androidx.core 1.5.0. 1.15.0 is the Android 15 release, matching
    // compileSdk 35.
    implementation 'androidx.core:core:1.15.0'

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'androidx.test:monitor:1.6.1'
    androidTestImplementation 'org.mockito:mockito-core:4.11.0'
}
