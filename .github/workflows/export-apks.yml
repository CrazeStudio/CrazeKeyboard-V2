name: Build and export APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crazekeyboard-apks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
      BRANCH_NAME: ${{ github.ref_name }}
    steps:
      - name: Check out CrazeKeyboard
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build components
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build stable and unstable APKs
        run: ./gradlew --no-daemon --stacktrace assembleStableDebug assembleUnstableDebug

      - name: Name exported APKs
        shell: bash
        run: |
          set -euo pipefail
          stable_apk="$(find build/outputs/apk/stable/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          unstable_apk="$(find build/outputs/apk/unstable/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$stable_apk"
          test -n "$unstable_apk"
          cp "$stable_apk" "CrazeKeyboard-stable-${VERSION_NAME}.apk"
          cp "$unstable_apk" "CrazeKeyboard-unstable-${VERSION_NAME}.apk"
          ls -lh CrazeKeyboard-*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CrazeKeyboard-APKs-${{ github.run_number }}
          path: CrazeKeyboard-*.apk
          if-no-files-found: error
          retention-days: 14
