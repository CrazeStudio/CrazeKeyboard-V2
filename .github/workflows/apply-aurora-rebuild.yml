name: Apply Aurora UI rebuild
on:
  push:
    branches: [main]
    paths:
      - aurora-rebuild.zip

permissions:
  contents: write

jobs:
  apply-aurora:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Aurora resources and fix duplicate colors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import re
          import zipfile

          archive = Path("aurora-rebuild.zip")
          files_written = []
          with zipfile.ZipFile(archive) as zf:
              for entry in zf.infolist():
                  member = PurePosixPath(entry.filename)
                  if entry.is_dir():
                      continue
                  if member.is_absolute() or ".." in member.parts:
                      raise SystemExit("Unsafe path in Aurora archive")
                  if len(member.parts) < 3 or member.parts[0:2] != ("aurora", "java"):
                      continue
                  rel = PurePosixPath(*member.parts[1:])
                  target = Path(*rel.parts)
                  if target.parts[0] != "java":
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(zf.read(entry.filename))
                  files_written.append(target.as_posix())

          if len(files_written) != 27:
              raise SystemExit(f"Expected 27 Aurora Java files, applied {len(files_written)}")

          remove_names = {
              "key_text_color_lxx_light",
              "key_functional_text_color_lxx_light",
              "key_text_inactive_color_lxx_light",
              "key_hint_letter_color_lxx_light",
              "language_on_spacebar_text_color_lxx_light",
              "auto_correct_color_lxx_light",
              "typed_word_color_lxx_light",
              "suggested_word_color_lxx_light",
              "key_text_color_lxx_dark",
              "key_functional_text_color_lxx_dark",
              "key_text_inactive_color_lxx_dark",
              "key_hint_letter_color_lxx_dark",
              "language_on_spacebar_text_color_lxx_dark",
              "auto_correct_color_lxx_dark",
              "suggested_word_color_lxx_dark",
              "setup_background",
              "setup_text_dark",
              "setup_step_background",
              "setup_welcome_video_margin_color",
          }
          colors = Path("java/res/values/colors.xml")
          kept = []
          removed = set()
          for line in colors.read_text(encoding="utf-8").splitlines(keepends=True):
              match = re.match(r'\s*<color\s+name="([^"]+)"', line)
              if match and match.group(1) in remove_names:
                  removed.add(match.group(1))
                  continue
              kept.append(line)
          if removed != remove_names:
              missing = sorted(remove_names - removed)
              raise SystemExit(f"Could not safely remove expected duplicate color entries: {missing}")
          colors.write_text("".join(kept), encoding="utf-8")
          print(f"Applied {len(files_written)} files; removed {len(removed)} duplicate color entries.")
          PY

      - name: Commit Aurora source to main and remove temporary helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f aurora-rebuild.zip .github/workflows/apply-aurora-rebuild.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A java aurora-rebuild.zip .github/workflows/apply-aurora-rebuild.yml
          git commit -m "Rebuild CrazeKeyboard UI with Aurora theme"
          git push origin HEAD:main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android build components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125"

      - name: Normalize custom resource namespaces
        run: |
          find java/res -type f -name '*.xml' -print0 | xargs -0 sed -i 's#http://schemas.android.com/apk/res/com.android.inputmethod.latin#http://schemas.android.com/apk/res-auto#g'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CrazeKeyboard-Aurora-debug-apk
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
