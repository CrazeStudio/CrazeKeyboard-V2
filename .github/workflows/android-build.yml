name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CRAZE_DEBUG_KEYSTORE: ${{ github.workspace }}/.ci/debug.keystore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # Persist the debug-only signing key between CI runs so users can
      # install future debug APKs as updates instead of uninstalling each build.
      - name: Cache debug signing key
        uses: actions/cache@v4
        with:
          path: .ci/debug.keystore
          key: craze-keyboard-debug-keystore-v1-${{ runner.os }}
      - name: Ensure stable debug signing key exists
        shell: bash
        run: |
          mkdir -p "$(dirname "$CRAZE_DEBUG_KEYSTORE")"
          if [ ! -f "$CRAZE_DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$CRAZE_DEBUG_KEYSTORE" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CrazeKeyboard-debug
          path: app/build/outputs/apk/debug/app-debug.apk
